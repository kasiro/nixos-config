# Hyprlock configuration
# Based on swrneko/dots-next style

general {
    disable_loading_bar = true
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    no_fade_in = false
}

background {
    monitor = 
    path = 
    blur_passes = 3
    blur_size = 8
    new_optimizations = true
    ignore_opacity = true
}

input-field {
    monitor = 
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgb(7366bd)
    inner_color = rgb(1a1b26)
    font_color = rgb(F5F3F2)
    fade_on_empty = true
    fade_timeout = 1000
    font_family = ComicShannsMono Nerd Font
    halign = center
    valign = center
    position = 0, -80
    placeholder_text = <i>Password...</i>
    hide_input = false
    check_color = rgb(94e2d5)
    fail_color = rgb(ff7a93)
}

label {
    monitor = 
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgb(F5F3F2)
    font_size = 80
    font_family = 0xProto Nerd Font Mono
    halign = center
    valign = center
    position = 0, 100
}

label {
    monitor = 
    text = cmd[update:100000] echo "$(date +'%A, %d %B %Y')"
    color = rgb(F5F3F2)
    font_size = 20
    font_family = ComicShannsMono Nerd Font
    halign = center
    valign = center
    position = 0, 20
}

image {
    monitor = 
    path = ~/.config/noctalia/wallpapers/current.jpg
    size = 150
    halign = center
    valign = center
    position = 0, 200
}
