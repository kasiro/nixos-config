# swrneko // dots-next — Noctalia 5
# Based on: https://github.com/swrneko/dots-next

[accessibility]
ui_scale = 1.05

[audio]
enable_sounds = true

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.62
    capsule = true
    capsule_fill = "surface"
    center = [ "group:g1" ]
    end = [ "tray", "sysmon", "bluetooth", "battery", "settings", "session", "control-center" ]
    font_family = "ComicShannsMono Nerd Font"
    margin_ends = 0
    radius = 16
    start = [ "launcher", "workspaces", "audio_visualizer", "active_window" ]

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface"
        id = "g1"
        members = [ "clock", "date" ]
        opacity = 1.0
        padding = 6.0

[dock]
active_monitor_only = true

[osd]
background_opacity = 0.58
offset_x = 8
offset_y = 15
position = "bottom_center"

[shell]
app_icon_color = "primary"
corner_radius_scale = 2.0
font_family = "ComicShannsMono Nerd Font"

    [shell.launcher]
    provider_prefix = ">"

        [shell.launcher.providers.calculator]
        global = false
        prefix = ""

    [shell.panel]
    launcher_placement = "attached"
    open_near_click_launcher = true
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true
    size = 28

    [shell.shadow]
    alpha = 1.0
    direction = "center"

[theme]
builtin = "Catppuccin"
community_palette = "EnterpriseMaterial"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "cava", "gtk3", "gtk4", "kcolorscheme", "qt" ]

[widget.audio_visualizer]
bands = 128
width = 128

[widget.launcher]
custom_image_colorize = true

[widget.workspaces]
font_weight = 400
label_source = "name"
