# swrneko // dots-next — Noctalia v5
# Based on: https://github.com/swrneko/dots-next
# Documentation: https://docs.noctalia.dev/noctalia/configuration/

[accessibility]
ui_scale = 1.05

[audio]
enable_sounds = true

# Noctalia v5 использует bar.main вместо bar.default
[bar.main]
position = "bottom"
background_opacity = 0.62
capsule = true
capsule_fill = "surface"
center = [ "clock", "date" ]
end = [ "tray", "sysmon", "bluetooth", "battery", "settings", "session", "control-center" ]
font_family = "ComicShannsMono Nerd Font"
margin_ends = 0
radius = 16
start = [ "launcher", "workspaces", "audio_visualizer", "active_window" ]
thickness = 34
padding = 14
widget_spacing = 6
font_scale = 1.0
shadow = true
reserve_space = true

[osd]
background_opacity = 0.58
offset_x = 8
offset_y = 15
position = "bottom_center"

[shell]
corner_radius_scale = 2.0
font_family = "ComicShannsMono Nerd Font"

    [shell.launcher]
    provider_prefix = ">"
    layout = "full"
    width = 760
    show_icons = true
    track_usage = true
    sort_by_usage = true

        [shell.launcher.providers.calculator]
        global = false
        prefix = ""

    [shell.panel]
    launcher_placement = "attached"
    open_near_click_launcher = true
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true
    size = 28

    [shell.shadow]
    alpha = 1.0
    direction = "center"

[theme]
builtin = "Catppuccin"
community_palette = "EnterpriseMaterial"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "cava", "gtk3", "gtk4", "kcolorscheme", "qt" ]

# Настройки виджетов в Noctalia v5 интегрированы в bar.main
# Отдельные [widget.*] секции используются для кастомных виджетов

[widget.audio_visualizer]
bands = 128
width = 128

[widget.launcher]
custom_image_colorize = true

[widget.workspaces]
font_weight = 400
label_source = "name"

# Input настройки для мыши/клавиатуры (Noctalia v5 / Umbriel)
# Примечание: для Hyprland эти настройки НЕ применяются — используется hyprland.lua
[input.mouse]
sensitivity = 0.0
natural_scroll = false
left_handed = false
accel_profile = "flat"

[input.keyboard]
layout = "us,ru"
options = "grp:alt_shift_toggle"
repeat_rate = 25
repeat_delay = 600
